# Nightly: pull the new nights of the live season, rebuild, validate, publish.
# The NHL API needs no key and serves any non-default User-Agent, so this runs
# headless on a GitHub runner. Nothing is committed unless the gate passes.
name: update-season
on:
  schedule:
    # GitHub starts scheduled runs late -- the 07:30 slot was firing around 12:40 UTC --
    # and on the hour is its busiest moment, so these sit at :47. The West Coast games end
    # about 04:00-05:00 UTC; the first two passes land them by mid-morning in Europe even
    # with the queue, and the third catches the league's overnight corrections.
    - cron: "47 4 * * *"
    - cron: "47 6 * * *"
    - cron: "47 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-season
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEASON: "2026-27"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - name: Fetch
        run: |
          python3 tools/fetch_nhl.py standings $SEASON
          python3 tools/fetch_nhl.py schedule $SEASON
          python3 tools/fetch_nhl.py games $SEASON
          python3 tools/fetch_nhl.py stats $SEASON
      - name: Build and gate
        run: |
          python3 tools/build_cards.py $SEASON
          python3 tools/fetch_images.py heads $SEASON
          python3 tools/validate.py $SEASON
          python3 render.py 2025-26
      - name: Publish if anything changed
        run: |
          git add -A data img *.html
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="nhl-bot" -c user.email="actions@users.noreply.github.com" \
            commit -m "Update $SEASON through $(date -u +%Y-%m-%d)"
          git push
